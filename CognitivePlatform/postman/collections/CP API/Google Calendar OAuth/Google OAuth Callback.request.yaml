$kind: http-request
description: Google redirects here after user approval. Exchanges the code for tokens and stores them. Not called manually.
url: "{{baseUrl}}/auth/google/callback"
method: GET
queryParams:
  - key: code
    value: null
    disabled: true
    description: Authorization code from Google (populated by redirect)
  - key: error
    value: null
    disabled: true
    description: Error string if user denied access
order: 2000
