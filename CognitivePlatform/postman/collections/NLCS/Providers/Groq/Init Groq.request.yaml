  type: json
  content: "{\r

    \  \"messages\": [\r

    \    {\r

    \      \"role\": \"user\",\r

    \      \"content\": {{GroqPrompt}}\r

    \    }\r

    \  ],\r

    \  \"model\": \"llama-3.3-70b-versatile\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{vault:Groq}}"
examples: .resources/Init Groq.resources/examples
order: 2000
