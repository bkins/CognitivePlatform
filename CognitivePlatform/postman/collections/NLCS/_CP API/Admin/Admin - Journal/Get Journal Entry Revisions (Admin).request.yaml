$kind: http-request
name: Get Journal Entry Revisions (Admin)
url: "{{baseUrl}}/api/admin/journal/entries/:entryId/revisions"
method: GET
headers:
  X-Admin-Secret: "{{adminSecret}}"
pathVariables:
  - key: entryId
    value: 0f26804a7d804bbe992b109b218d2d21
    description: Journal entry ID (32-char hex, e.g. from Get All Entries response)
order: 2000
